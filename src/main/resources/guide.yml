# ======================================================================
#  PNJ Guide - modifiez librement. Après modification : /bountycraft reload
#  Les pages de livre utilisent MiniMessage. Gardez ~250 caractères par page.
# ======================================================================
discord: "https://discord.gg/VOTRE-INVITATION"
website: "https://www.votre-site.fr"

rules-pages:
  - |
    <dark_red><bold>RÈGLES (1/3)</bold>

    <black>1. <dark_gray>Respect : pas d'insultes, de harcèlement ni de discrimination envers les joueurs ou le staff.

    <black>2. <dark_gray>Pas de triche : x-ray, fly, kill-aura, macros, autoclick et tout mod donnant un avantage sont interdits.
  - |
    <dark_red><bold>RÈGLES (2/3)</bold>

    <black>3. <dark_gray>Pas de grief ni de vol : ne détruisez pas et ne volez pas les constructions ou coffres des autres.

    <black>4. <dark_gray>PvP : autorisé uniquement contre votre cible Hunter, pendant une Chasse, ou avec l'accord de l'autre joueur. Spawn-kill interdit.
  - |
    <dark_red><bold>RÈGLES (3/3)</bold>

    <black>5. <dark_gray>Pas d'exploitation de bugs ni de duplication d'objets ou d'argent : signalez-les au staff.

    <black>6. <dark_gray>Pas de publicité ni de spam.

    <black>7. <dark_gray>Les décisions du staff sont finales (avertissement, mute, kick, ban).

howto-pages:
  - |
    <dark_green><bold>FONCTIONNEMENT (1/4)</bold>

    <black><bold>L'argent</bold>
    <dark_gray>/bank : votre solde
    /pay \<joueur> \<montant> : payer
    /baltop : classement

    On gagne de l'argent en chassant d'autres joueurs (voir suite).
  - |
    <dark_green><bold>FONCTIONNEMENT (2/4)</bold>

    <black><bold>Le Hunter</bold>
    <dark_gray>Choisissez une cible puis tuez-la pour toucher sa prime.

    Plus un joueur est mort de la main d'autres joueurs, plus sa prime est petite.

    /contract : voir ou annuler votre contrat (1 h max).
  - |
    <dark_green><bold>FONCTIONNEMENT (3/4)</bold>

    <black><bold>Les Chasses</bold>
    <dark_gray>Les admins lancent /hunt : pendant 30 min, tout le serveur doit traquer un joueur.

    Une boss bar affiche le temps, la prime et les coordonnées de la cible. Le tueur empoche la prime !
  - |
    <dark_green><bold>FONCTIONNEMENT (4/4)</bold>

    <black><bold>Forgeron & Alchimiste</bold>
    <dark_gray>Dépensez votre argent en outils/armes légendaires et en élixirs.

    Un élixir = un effet passif + une compétence (touche F). Un seul élixir à la fois, perdu à la mort.
